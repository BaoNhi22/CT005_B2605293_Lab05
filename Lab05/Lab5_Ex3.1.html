<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và Nhiệm vụ 2.2</title>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			line-height: 1.6;
			color: #1f2937;
			background: #f3f4f6;
		}

		main {
			width: min(960px, 92%);
			margin: 40px auto;
			padding: 32px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
		}

		h1, h2 { color: #1d4ed8; }
		h1 { margin-top: 0; text-align: center; }
		.description { text-align: center; }

		.infographic {
			display: block;
			max-width: 100%;
			height: auto;
			margin: 24px auto;
			border-radius: 8px;
		}

		.video {
			position: relative;
			width: 100%;
			padding-top: 56.25%;
		}

		.video iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
			border-radius: 8px;
		}

		footer {
			margin-top: 28px;
			padding-top: 16px;
			border-top: 1px solid #d1d5db;
			color: #6b7280;
			font-size: 0.9rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<main>
		<h1>Infographic và video Nhiệm vụ 2.2</h1>
		<p class="description">
			Khám phá nội dung infographic và theo dõi video hướng dẫn thực hiện bài tập Nhiệm vụ 2.2.
		</p>

		<h2>Infographic</h2>
		<img class="infographic" src="Lab05_Ex2.1.png"
			 alt="Infographic của bài thực hành Lab 05">

		<h2>Video hướng dẫn Nhiệm vụ 2.2</h2>
		<div class="video">
			<iframe src="https://youtu.be/PSqMVG3-xJU"
					title="Video hướng dẫn bài tập Nhiệm vụ 2.2"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					allowfullscreen></iframe>
		</div>

		<footer>
			© 2025 CT005_B2605293_Lab05. Nội dung và hình ảnh được sử dụng cho mục đích học tập.
		</footer>
	</main>
</body>
</html>
