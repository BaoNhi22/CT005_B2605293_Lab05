<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Infographic và video Nhiệm vụ 2.2</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #eef4f8;
		}
		main {
			width: min(100% - 32px, 1000px);
			margin: 32px auto;
			padding: 32px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, .1);
		}
		h1 { margin-top: 0; color: #0f4c81; text-align: center; }
		.intro { text-align: center; line-height: 1.6; }
		.section { margin-top: 28px; }
		h2 { color: #0f4c81; border-left: 5px solid #f59e0b; padding-left: 10px; }
		img { display: block; max-width: 100%; height: auto; margin: 16px auto; border-radius: 8px; }
		.video { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #111; }
		iframe { width: 100%; height: 100%; border: 0; }
		.note { margin-top: 28px; padding-top: 16px; border-top: 1px solid #d1d5db; font-size: .9rem; color: #6b7280; text-align: center; }
	</style>
</head>
<body>
	<main>
		<h1>Infographic và video Nhiệm vụ 2.2</h1>
		<p class="intro">Khám phá nội dung infographic và theo dõi video hướng dẫn thực hiện bài tập trong Nhiệm vụ 2.2.</p>

		<section class="section" aria-labelledby="infographic-title">
			<h2 id="infographic-title">Infographic</h2>
			<img src="Lab05_Ex2.1.png" alt="Infographic của bài thực hành Lab 05">
		</section>

		<section class="section" aria-labelledby="video-title">
			<h2 id="video-title">Video bài tập Nhiệm vụ 2.2</h2>
			<div class="video">
				<!-- Thay VIDEO_ID bằng mã video YouTube của Nhiệm vụ 2.2 nếu cần. -->
				<iframe src="https://youtu.be/PSqMVG3-xJU" title="Video bài tập Nhiệm vụ 2.2" allowfullscreen></iframe>
			</div>
		</section>

		<p class="note">© 2025 CT005_B2605293. Infographic và video thuộc bản quyền của chủ sở hữu tương ứng. Không sao chép khi chưa được phép.</p>
	</main>
</body>
</html>
